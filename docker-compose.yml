version: '3.8'

services:
  app1:
    build: .
    container_name: app1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: npm run dev

  app2:
    build: .
    container_name: app2
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
    command: npm run dev

  app3:
    build: .
    container_name: app3
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
    command: npm run dev

  nginx:
    image: nginx:latest
    container_name: nginx-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    network_mode: "host"